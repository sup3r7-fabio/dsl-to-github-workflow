name: VS Code Extension

on:
  push:
    branches: [ main ]
    paths:
      - 'vscode-extension/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'vscode-extension/**'

jobs:
  test-extension:
    name: Test VS Code Extension
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: vscode-extension/package-lock.json

    - name: Install dependencies
      run: |
        cd vscode-extension
        npm ci

    - name: Run lint
      run: |
        cd vscode-extension
        npm run lint

    - name: Compile TypeScript
      run: |
        cd vscode-extension
        npm run compile

    - name: Run tests
      run: |
        cd vscode-extension
        xvfb-run -a npm test

    - name: Package extension
      run: |
        cd vscode-extension
        npm run package

    - name: Upload VSIX
      uses: actions/upload-artifact@v4
      with:
        name: vscode-extension
        path: vscode-extension/*.vsix
        retention-days: 30

  publish-extension:
    name: Publish to VS Code Marketplace
    runs-on: ubuntu-latest
    needs: test-extension
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: vscode-extension/package-lock.json

    - name: Install dependencies
      run: |
        cd vscode-extension
        npm ci

    - name: Package extension
      run: |
        cd vscode-extension
        npm run package

    - name: Publish to VS Code Marketplace
      run: |
        cd vscode-extension
        npx vsce publish --pat ${{ secrets.VSCE_TOKEN }}
      env:
        VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
