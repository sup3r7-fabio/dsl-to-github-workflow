name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.23', '1.24']
    
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go ${{ matrix.go-version }}
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Run tests
      run: go test -v -race -coverprofile=coverage.out ./...

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache: true

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest
        args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, lint]
    
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        cache: true

    - name: Build CLI
      run: |
        go build -v -o bin/dsl-cli ./cmd/golang-vibe-coding
        chmod +x bin/dsl-cli

    - name: Test CLI commands
      run: |
        ./bin/dsl-cli --version
        ./bin/dsl-cli --help
        ./bin/dsl-cli greet GitHub
        
    - name: Test DSL compilation
      run: |
        if [ -f examples/simple.dsl ]; then
          ./bin/dsl-cli compile examples/simple.dsl --output test-output.yml
          cat test-output.yml
        fi

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dsl-cli-linux
        path: bin/dsl-cli
        retention-days: 30
